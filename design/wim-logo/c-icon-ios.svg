<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- WIM app icon — C · W Monogram. Full-bleed square: iOS masks its own corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A58E8"/>
      <stop offset="0.55" stop-color="#5B49D6"/>
      <stop offset="1" stop-color="#37279E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wick" gradientUnits="userSpaceOnUse" x1="0" y1="322" x2="0" y2="196">
      <stop offset="0" stop-color="#FFAD1F"/>
      <stop offset="1" stop-color="#FFD37A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- faint grid — the "data paper" texture, barely-there premium detail -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>
  <!-- W as chart swings, white, soft drop shadow -->
  <path d="M222 318 L376 706 L512 428 L648 706 L802 326"
        fill="none" stroke="#1F1653" stroke-opacity="0.35" stroke-width="86"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(0 14)"/>
  <path d="M222 318 L376 706 L512 428 L648 706 L802 326"
        fill="none" stroke="#FFFFFF" stroke-width="82"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gold candle wick rising off the last upstroke -->
  <line x1="802" y1="322" x2="802" y2="196" stroke="url(#wick)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="802" cy="322" r="46" fill="#FFAD1F"/>
</svg>
