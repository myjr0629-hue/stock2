apply plugin: 'com.android.application'

// Release signing — reads android/keystore.properties (gitignored, not committed).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.signumhq.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // minSdk 24 부터 Gradle 이 v1(JAR) 서명을 «자동으로» 끈다. Play 는 AAB 를
            // 재서명하므로 여태 문제가 없었지만, 서드파티 스토어(Softonic 등)의 검증기는
            // jarsigner = v1 을 본다 → v2 단독 APK 는 "서명을 확인할 수 없음"으로 반려된다.
            // (2026-08-22 Softonic 실측). v1 은 «추가» 서명이라 v2 와 공존하며 부작용 없음.
            enableV1Signing true
            enableV2Signing true
        }
    }
    defaultConfig {
        applicationId "com.signumhq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AdMob: production Android App ID (개인 게시자 ca-app-pub-9554397112094712, 2026-08-18 교체).
        // Env override kept for flexibility; defaults to the real production ID.
        def adMobAppId = System.getenv("ADMOB_ANDROID_APP_ID") ?: "ca-app-pub-9554397112094712~1354734212"
        manifestPlaceholders = [adMobAppId: adMobAppId]
        if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } &&
                adMobAppId == "ca-app-pub-3940256099942544~3347511713") {
            throw new GradleException("ADMOB_ANDROID_APP_ID must not be the Google test ID for release builds.")
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // «내 종목» 위젯 30분 갱신 — AdMob SDK 가 이미 끌어오는 WorkManager 를 명시만 한다(새 의존성 아님 · 같은 판본)
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    // Worker 의 부모(ListenableWorker)가 쓰는 ListenableFuture — 컴파일에만 필요하다(실행 시엔 WorkManager·AdMob 이 이미 싣는다).
    // listenablefuture:1.0 은 다른 의존성의 «9999.0-empty» 판본에 밀려 빈 jar 가 된다 → guava 한 개 jar 만(전이 없음) 컴파일 경로에.
    compileOnly("com.google.guava:guava:31.1-android") { transitive = false }
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ★2026-10-05 출시 사고 방지 — 캡시터 설정(npx cap sync 산출물, gitignore)이 없으면 «릴리스 빌드를 실패»시킨다.
//   9/30 1.3.1 은 워크트리에서 cap sync 없이 빌드돼(복사 실패를 2>/dev/null 이 숨김) 설정 없이 출시됐다 → 앱이 https://localhost 를 열고
//   «웹페이지를 사용할 수 없음»으로 5일간 열리지 않았다. 그때 gradle 은 BUILD SUCCESSFUL 이었다. 제출 전에는 scripts/android-release-check.sh 도 돌린다.
def checkCapacitorAssets = tasks.register('checkCapacitorAssets') {
    doLast {
        def assets = file('src/main/assets')
        def cfg = new File(assets, 'capacitor.config.json')
        def plugins = new File(assets, 'capacitor.plugins.json')
        def index = new File(assets, 'public/index.html')
        def problems = []
        if (!cfg.exists()) {
            problems << 'assets/capacitor.config.json 없음'
        } else if (!(cfg.text =~ /"url"\s*:\s*"https:\/\/www\.signumhq\.com\//)) {
            problems << 'capacitor.config.json 에 운영 server.url(https://www.signumhq.com/…) 없음'
        }
        if (!plugins.exists() || !plugins.text.contains('@revenuecat/purchases-capacitor')) problems << 'assets/capacitor.plugins.json 없음 또는 RevenueCat 없음'
        if (!index.exists()) problems << 'assets/public/index.html 없음'
        if (!problems.isEmpty()) {
            throw new GradleException('⛔ 릴리스 빌드 중단 — ' + problems.join(' · ') + ' → 정상 저장소에서 npx cap sync android(Node 22) 뒤 다시 빌드')
        }
        println '✓ 캡시터 설정 확인(server.url·plugins·public)'
    }
}
tasks.configureEach { t ->
    if (t.name == 'preReleaseBuild') t.dependsOn checkCapacitorAssets
}
