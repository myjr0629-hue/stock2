# SIGNUM HQ — WebSocket Reverse Proxy
# Cloudflare handles SSL termination (Flexible/Full mode)
# Nginx proxies HTTP/WS on port 80 to internal WS servers

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name ws.signumhq.com;

    # Guardian WebSocket Hub
    location /guardian {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Price WebSocket Hub (root path)
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health checks
    location = /health {
        proxy_pass http://127.0.0.1:8084/health;
    }

    location = /guardian/health {
        proxy_pass http://127.0.0.1:8082/health;
    }

    # Capture Worker Proxy (port 3100 via nginx)
    location /capture {
        proxy_pass http://127.0.0.1:3100/capture;
        proxy_read_timeout 35s;
        client_max_body_size 1m;
    }

    location /capture-health {
        proxy_pass http://127.0.0.1:3100/health;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ws.signumhq.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ws.signumhq.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ws.signumhq.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name ws.signumhq.com;
    return 404; # managed by Certbot


}
