<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNUM 관제 콘솔</title>
<style>
:root{
  --bg:#0B0E14; --panel:#131823; --panel2:#0F141E; --line:#1F2633; --line2:#2A3346;
  --tx:#E4E8F1; --mut:#8A93A6; --dim:#5C6479;
  --accent:#F2A93B; --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --info:#38BDF8;
  --opus:#A78BFA; --fable:#F2A93B; --sonnet:#38BDF8; --haiku:#4ADE80; --other:#7C8598;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0B0E14 70%,rgba(11,14,20,.92));border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:14px;margin:0;letter-spacing:.3px;font-weight:650}
h1 span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--mut)}
.pill b{color:var(--tx);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.dot.off{background:var(--bad)}
.spacer{flex:1}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--dim)}
button.on{background:rgba(248,113,113,.14);border-color:var(--bad);color:#FFD4D4}
button.on.pub{background:rgba(251,191,36,.14);border-color:var(--warn);color:#FFE9B8}
main{padding:14px 16px 40px;max-width:1680px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.tile .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tile .v{font-size:22px;font-weight:640;margin-top:3px;letter-spacing:-.4px}
.tile .s{font-size:11px;color:var(--dim);margin-top:2px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
section>h2{margin:0;padding:10px 13px;font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
section>h2 .tag{margin-left:auto;font-size:10.5px;color:var(--dim);text-transform:none;letter-spacing:0}
.body{padding:11px 13px}
.body.flush{padding:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 13px;border-bottom:1px solid rgba(31,38,51,.7)}
th{font-size:10.5px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--mono);font-size:11.5px}
.scroll{max-height:340px;overflow:auto}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.lane{display:grid;grid-template-columns:118px 1fr 86px;gap:9px;align-items:center;margin-bottom:9px}
.lane .nm{font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--tx)}
.chip{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.chip.ceo{border-color:rgba(242,169,59,.5);color:var(--accent);background:rgba(242,169,59,.09)}
.chip.mkt{border-color:rgba(56,189,248,.4);color:var(--info);background:rgba(56,189,248,.08)}
.ev{display:grid;grid-template-columns:52px 96px 1fr;gap:9px;padding:4px 13px;border-bottom:1px solid rgba(31,38,51,.55);font-size:11.5px;align-items:baseline}
.ev:hover{background:rgba(255,255,255,.02)}
.ev .ts{color:var(--dim);font-family:var(--mono);font-size:11px}
.ev .nm{color:var(--tx);font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .cm{color:var(--mut);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pre .nm{color:var(--info)}.ev.post .nm{color:var(--mut)}.ev.stop .nm{color:var(--accent)}
.ev.fail .nm{color:var(--bad)}.ev.ctrl{background:rgba(242,169,59,.06)}.ev.ctrl .nm{color:var(--accent)}
.ev.sub .nm{color:var(--opus)}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px}
.spark i{flex:1;background:linear-gradient(180deg,var(--info),rgba(56,189,248,.25));border-radius:2px 2px 0 0;min-height:2px}
.note{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--tx);font:inherit;padding:8px 10px;resize:vertical;min-height:58px}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
.empty{color:var(--dim);font-size:12px;padding:10px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(31,38,51,.5);font-size:12px}
.kv:last-child{border-bottom:0}.kv b{font-weight:600}
.warnbox{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:#FFE9B8;border-radius:8px;padding:8px 10px;font-size:11.5px;margin:0 13px 11px}

/* ── 그래픽 메인 ───────────────────────────────────────── */
.canvas{background:linear-gradient(180deg,#0E131C,#0B0E14);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
.canvas .hd{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.canvas .hd .legend{margin-left:auto;display:flex;gap:10px;font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--dim)}
.canvas .hd .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cv-wrap{overflow-x:auto;overflow-y:hidden}
.cv-wrap::-webkit-scrollbar{height:8px}.cv-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
svg .node{cursor:pointer}
svg .node rect{transition:.15s}
svg .node:hover rect.card{stroke:var(--tx)}
svg text{font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:1200px){.gcols{grid-template-columns:1fr}}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.cmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:12px 13px}
.cmap a{display:block;border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:10.5px;color:var(--mut);background:var(--panel2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cmap a.pub{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.12);color:#CFF7E6}
.cmap a.gate{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.10);color:#FFE9B8}
.cmap a.off{opacity:.42}
.cmap a b{color:var(--tx);font-weight:650}
/* ── 세부 탭 ───────────────────────────────────────────── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.tabs button{padding:6px 12px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.tabs button.sel{background:rgba(242,169,59,.13);border-color:var(--accent);color:#FFE3B0}
.tabs button .n{color:var(--dim);margin-left:5px;font-variant-numeric:tabular-nums}
.tabs button.sel .n{color:var(--accent)}
.panes>section{display:none}
.panes>section.show{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}

/* «지금 무엇을 하는가» — 파이프라인이 집계만 보여 주고 현재 작업을 안 보여 줬다(대표 지적 2026-09-18) */
.nowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 10px;
  border:1px solid var(--line2);border-radius:9px;background:#10161F;font-size:11.5px}
.nowline .k{font-weight:700;color:var(--tx)}
.nowline .v{color:var(--mut)}
.nowline .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.nowline .sep{color:var(--line2)}
.nowline .how{color:var(--dim);font-size:10.5px}
@keyframes nodepulse{0%,100%{opacity:.25}50%{opacity:.9}}
.node.active .halo{animation:nodepulse 1.6s ease-in-out infinite}

/* 성과 패널 — 활동이 아니라 «결과»를 본다 */
.perf{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 2px}
@media (max-width:900px){.perf{grid-template-columns:1fr}}
.perf h4{margin:0 0 8px;font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.04em}
.perf table{width:100%;border-collapse:collapse;font-size:11.5px}
.perf th{text-align:left;font-weight:600;color:var(--dim);padding:4px 6px;border-bottom:1px solid var(--line2)}
.perf th.n{text-align:right}
.perf td{padding:5px 6px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.perf td.n{text-align:right}
.perf .win{color:var(--ok);font-weight:700}
.perf .zero{color:var(--dim)}
.perf .bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
.perf .bar i{display:block;height:100%;background:var(--info)}
.perf .warn{color:var(--warn);font-size:10.5px;margin-top:6px}

.perf .chd{display:block;font-size:9.5px;color:var(--dim);margin-top:1px;line-height:1.3}
.perf td:first-child{max-width:0;width:44%}

.perf .rt{grid-column:1/-1;padding:8px 10px;margin:0 0 4px;border-radius:8px;font-size:11.5px;border:1px solid var(--line2)}
.perf .rt.bad{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.35)}
.perf .rt.ok{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.35)}
.perf .rt b{margin-right:8px;color:var(--tx)}
</style></head><body>
<header><div class="hrow">
  <h1>SIGNUM <span>관제·제어 콘솔</span></h1>
  <span class="pill"><i class="dot" id="d-live"></i><span id="t-live">연결 중</span></span>
  <span class="pill">세션 <b id="t-msgs">–</b> 메시지</span>
  <span class="pill">전사 <b id="t-scan">–</b></span>
  <span class="pill">갱신 <b id="t-now">–</b></span>
  <div class="spacer"></div>
  <button id="b-pause">⏸ 일시정지</button>
  <button id="b-pub" class="pub">⛔ 발행 금지</button>
  <button id="b-reload">↻ 새로고침</button>
</div></header>
<main>
  <div class="tiles" id="tiles"></div>

  <div class="canvas">
    <div class="hd">사이클 파이프라인 — 지금 이 시간
      <span class="legend"><span><i style="background:var(--ok)"></i>완료</span><span><i style="background:var(--info)"></i>진행</span><span><i style="background:var(--warn)"></i>대표 대기</span><span><i style="background:var(--dim)"></i>대기</span><span><i style="background:var(--bad)"></i>차단</span></span>
    </div>
    <div id="nowline" class="nowline"></div>
    <svg id="pipe" viewBox="0 0 1120 306" style="width:100%;height:auto;display:block"></svg>
  </div>

  <!-- ★ 성과 — 대표 지시(2026-09-19): 「관제 제어에 성과부분도 만들어서 보고하도록해」
       활동(발행 건수·토큰)이 아니라 «결과»만 본다: 설치·CPA·유입 클릭. 추측값은 넣지 않는다. -->
  <div class="canvas">
    <div class="hd">성과 — 광고와 유입<span class="legend" id="perf-when"></span></div>
    <div id="perf"></div>
  </div>

  <div class="gcols">
    <div class="canvas">
      <div class="hd">모델 · 에이전트 레인<span class="legend" id="lane-note"></span></div>
      <svg id="lanes" viewBox="0 0 760 196" style="width:100%;height:auto;display:block;padding:8px 4px"></svg>
    </div>
    <div class="canvas">
      <div class="hd">채널 맵<span class="legend"><span><i style="background:var(--ok)"></i>오늘 발행</span><span><i style="background:var(--warn)"></i>게이트</span><span><i style="background:var(--line2)"></i>대기</span></span></div>
      <div class="cmap" id="cmap"></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panes" id="panes">
    <section data-tab="tickets" class="show"><h2>대표 결정 대기 · 티켓<span class="tag" id="tk-n"></span></h2><div class="body flush scroll" id="tickets"></div></section>
    <section data-tab="pubs"><h2>오늘 발행<span class="tag" id="pub-n"></span></h2><div class="body flush scroll" id="pubs"></div></section>
    <section data-tab="events"><h2>실시간 이벤트<span class="tag" id="ev-n"></span></h2><div class="body flush scroll" id="events"></div></section>
    <section data-tab="models"><h2>모델별 토큰 — 이 세션 전사 실측<span class="tag">추측 없음 · usage 합산</span></h2><div class="body" id="models"></div></section>
    <section data-tab="tools"><h2>도구 호출 분포<span class="tag" id="tools-n"></span></h2><div class="body" id="tools"></div></section>
    <section data-tab="metrics"><h2>지표 — 클릭 · 광고 · Redis<span class="tag" id="met-age"></span></h2><div class="body" id="metrics"></div></section>
    <section data-tab="slot"><h2>이번 시간 배정<span class="tag" id="slot-at"></span></h2><div class="body" id="slotd"></div></section>
    <section data-tab="cycles"><h2>사이클 기록</h2><div class="body" id="cycles"></div></section>
    <section data-tab="git"><h2>커밋<span class="tag" id="git-b"></span></h2><div class="body flush scroll" id="git"></div></section>
    <section data-tab="control"><h2>제어 — 대표 지시(다음 프롬프트에 주입 · 24시간 만료)</h2><div class="body">
      <textarea class="note" id="note" placeholder="예) 오늘은 발행보다 서치어드바이저 마무리를 먼저. — 저장하면 다음 턴부터 내가 참고 정보로 읽습니다."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button id="b-note">저장</button><span class="pill" id="note-st">–</span></div>
    </div></section>
  </div>
</main>
<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n)=>n==null?'–':Intl.NumberFormat('ko-KR').format(Math.round(n));
const kf=(n)=>n==null?'–':(n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n)));
const hm=(t)=>new Date(t).toLocaleTimeString('ko-KR',{hour12:false});
const MC=(m)=>/opus/.test(m)?'var(--opus)':/fable/.test(m)?'var(--fable)':/sonnet/.test(m)?'var(--sonnet)':/haiku/.test(m)?'var(--haiku)':'var(--other)';
const MN=(m)=>String(m).replace('claude-','').replace(/-\d{8}$/,'').replace('-5-1','-5.1');
let S=null;

function tiles(s){
  const mk=s.marketing, tot=Object.values(s.usage.byModel||{}).reduce((a,b)=>a+b.output+b.cacheCreate,0);
  const t=[
    ['오늘 발행', mk.todayCount, mk.today+' (KST) · 원장 누적 '+mk.total],
    ['대표 결정 대기', mk.ceoTickets, '전체 열린 티켓 '+mk.tickets.length],
    ['채널', mk.channels.enabled+'/'+mk.channels.total, '가동 / 등록'],
    ['출력+캐시생성 토큰', kf(tot), '이 세션 전사 합산'],
    ['도구 호출', kf(Object.values(s.usage.tools||{}).reduce((a,b)=>a+b,0)), '전사 tool_use 합산'],
    ['제어', (s.state.paused?'정지':'실행')+(s.state.noPublish?' · 발행금지':''), s.state.updatedAt?hm(s.state.updatedAt):'–'],
    ['커밋', s.git.dirty+'개 변경', (s.git.head||'').split('\t')[0]||'–'],
  ];
  $('#tiles').innerHTML=t.map(([k,v,sub])=>`<div class="tile"><div class="k">${esc(k)}</div><div class="v num">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`).join('');
}
function evClass(e){ const v=e.ev||''; if(v==='CONTROL')return 'ctrl'; if(/Failure/.test(v))return 'fail'; if(v==='PreToolUse')return 'pre'; if(v==='Stop')return 'stop'; if(/Subagent|Task/.test(v))return 'sub'; return 'post'; }
function events(list){
  $('#ev-n').textContent=list.length?('최근 '+list.length+'건'):'';
  $('#events').innerHTML = list.length? list.map(e=>`<div class="ev ${evClass(e)}"><span class="ts">${hm(e.t)}</span><span class="nm">${esc(e.ev)}${e.tool?' · '+esc(e.tool):''}</span><span class="cm">${esc(e.err||e.cmd||'')}</span></div>`).join('')
    : `<div class="empty" style="padding:12px 13px">아직 이벤트가 없습니다 — 훅이 붙으면 도구 호출이 여기에 실시간으로 흐릅니다.</div>`;
}
function models(s){
  const bm=s.usage.byModel||{}; const keys=Object.keys(bm);
  if(!keys.length){ $('#models').innerHTML='<div class="empty">전사 스캔 대기 중…</div>'; return; }
  const rows=keys.map(k=>({k,...bm[k],w:bm[k].output+bm[k].cacheCreate})).sort((a,b)=>b.w-a.w);
  const max=Math.max(...rows.map(r=>r.w))||1;
  const cost=(s.otel&&s.otel.cost)||null;
  $('#models').innerHTML = rows.map(r=>`<div class="lane">
    <div class="nm"><i class="dot" style="background:${MC(r.k)}"></i>${esc(MN(r.k))}</div>
    <div class="bar"><i style="width:${(r.w/max*100).toFixed(1)}%;background:${MC(r.k)}"></i></div>
    <div class="num" style="text-align:right;font-size:11.5px">${kf(r.w)}</div>
  </div>`).join('')
  + `<table style="margin-top:6px"><tr><th>모델</th><th style="text-align:right">메시지</th><th style="text-align:right">출력</th><th style="text-align:right">사고</th><th style="text-align:right">캐시생성</th><th style="text-align:right">캐시읽기</th><th style="text-align:right">비용</th></tr>`
  + rows.map(r=>`<tr><td><i class="dot" style="display:inline-block;background:${MC(r.k)}"></i> ${esc(MN(r.k))}</td><td class="num" style="text-align:right">${nf(r.msgs)}</td><td class="num" style="text-align:right">${kf(r.output)}</td><td class="num" style="text-align:right">${kf(r.thinking)}</td><td class="num" style="text-align:right">${kf(r.cacheCreate)}</td><td class="num" style="text-align:right">${kf(r.cacheRead)}</td><td class="num" style="text-align:right">${cost&&cost[r.k]!=null?('$'+Number(cost[r.k]).toFixed(2)):'<span style="color:var(--dim)">미설정</span>'}</td></tr>`).join('')
  + `</table>`

   사이클 단계에 안 맞으면 «사이클 외 작업»이라고 정직하게 말한다 — 없는 진행을 그리지 않는다. */
const STAGE=[
  [/mkt-plan\.js\s+slot/,'slot'], [/audit-expiration-selection/,'gate'],
  [/mkt-plan\.js\s+pub/,'ver'],   [/ads-today|app-ads\.apple/,'ads'],
  [/git\s+(add|commit|push)/,'rec'], [/QUEUE\.json|mkt-plan\.js\s+(ticket|done|fail)/,'rep'],

function whatNow(s){
  // 소스 둘: ①전사 스캔의 lastTool(15초마다 갱신 — 항상 살아 있다) ②훅 이벤트(다음 세션부터)
  // 더 «최근»인 쪽을 쓴다. 예전엔 훅만 봐서 6시간 묵은 이벤트를 «지금»이라 그렸다.
  const lt=s.usage&&s.usage.lastTool;
  const evs=(s.events||[]);
  const ev=evs.find(e=>e.ev==='PreToolUse'||e.ev==='PostToolUse')||evs[0]||null;
  const ltT=lt&&lt.ts?Date.parse(lt.ts):0, evT=ev&&ev.t?ev.t:0;
  const last = (ltT>=evT&&lt) ? {t:ltT,tool:lt.name,cmd:lt.hint} : ev;
  if(!last) return {node:null,label:'대기 중',detail:'도구 기록 없음',age:null};
  const hay=String(last.cmd||'')+' '+String(last.tool||'');
  for(const [re,key] of STAGE) if(re.test(hay)) return {node:key,label:null,detail:hay.trim().slice(0,90),age:last.t,tool:last.tool};
  return {node:null,label:'사이클 외 작업',detail:hay.trim().slice(0,90)||(last.tool||last.ev),age:last.t,tool:last.tool};
}

  const m = s.metrics || {}, ads = m.ads || null, cl = m.clicks || null;
  const host = $('#perf'), when = $('#perf-when');
  when.textContent = ads && ads.at ? new Date(ads.at).toLocaleString('ko-KR',{hour12:false}).slice(5,17) + ' 판독' : '미측정';
  host.className = 'perf';
  if (!ads && !cl) { host.innerHTML = '<div class="warn">아직 측정값이 없다 — node scripts/hud/collect.js 로 채운다.</div>'; return; }
  // ★ 별점 — 2026-09-19 실측으로 확정한 병목. 광고·클릭보다 위에 둔다.
  const rt = m.ratings;
  if (rt && rt.rows) {
    const withStar = rt.rows.filter(function(r){ return r.rating; }).length;
    host.insertAdjacentHTML; // no-op, 아래에서 통째로 그린다
    var ratingBlock = '<div class="rt ' + (withStar ? 'ok' : 'bad') + '">'
      + '<b>Play 별점</b> '
      + rt.rows.map(function(r){
          return esc(r.name.replace(/ HQ$/,'').replace(/^Why.d It Move\?$/,'WIM')) + ' '
            + (r.rating ? '<span class="win">★' + esc(r.rating) + '</span>' : '<span class="zero">0</span>'); }).join(' · ')
      + (withStar ? '' : ' — <span class="zero">세 앱 모두 0. 노출→열람 0.5% 의 고리가 안 풀렸다</span>')
      + '</div>';
  } else { var ratingBlock = '<div class="rt bad"><b>Play 별점</b> <span class="zero">미측정</span></div>'; }

  let left = ratingBlock + '<h4>애플 광고 · 오늘</h4>';
  if (ads) {
    const per = ads.per || [];
    left += '<table><tr><th>캠페인</th><th class="n">지출</th><th class="n">탭</th><th class="n">설치</th><th class="n">CPA</th></tr>'
      + per.map(function(p){
          const nm = String(p.name).replace(/^SIGNUM /,'').replace(/ - Search Results - Exact/,'').replace(/ - Search Tab/,' 탭');
          return '<tr><td>' + esc(nm) + (p.state==='일시 정지됨' ? ' <span class="zero">(정지)</span>' : '') + '</td>'
            + '<td class="n">$' + (+p.spend).toFixed(2) + '</td><td class="n">' + p.taps + '</td>'
            + '<td class="n ' + (p.installs ? 'win' : 'zero') + '">' + p.installs + '</td>'
            + '<td class="n">' + (p.installs ? ('$' + (+p.cpa).toFixed(2)) : '—') + '</td></tr>'; }).join('')
      + '<tr><td><b>합계</b></td><td class="n"><b>' + esc(ads.spend) + '</b></td><td class="n"><b>' + esc(ads.taps) + '</b></td>'
      + '<td class="n ' + ((+ads.installs) ? 'win' : 'zero') + '"><b>' + esc(ads.installs) + '</b></td><td class="n">—</td></tr></table>';
    if (ads.isToday === false) left += '<div class="warn">⚠ 기간이 «오늘»로 고정된 판독이 아니다 — 하루 한도와 비교하지 말 것</div>';
  } else left += '<div class="warn">미측정</div>';
  let right = '<h4>유입 클릭 · 채널별</h4>';
  if (cl && cl.rows && cl.rows.length) {
    const max = Math.max.apply(null, [1].concat(cl.rows.map(function(r){return r.d21;})));
    right += '<table><tr><th>채널</th><th class="n">오늘</th><th class="n">3일</th><th class="n">21일</th><th style="width:28%"></th></tr>'
      + cl.rows.slice(0,10).map(function(r){ const d=CHDESC[r.ch]||''; return '<tr><td title="' + esc(d) + '">' + esc(r.ch)
          + (d ? '<span class="chd">' + esc(d) + '</span>' : '') + '</td>'
          + '<td class="n ' + (r.today ? '' : 'zero') + '">' + r.today + '</td><td class="n">' + r.d3 + '</td>'
          + '<td class="n"><b>' + r.d21 + '</b></td>'
          + '<td><div class="bar"><i style="width:' + Math.round(r.d21/max*100) + '%"></i></div></td></tr>'; }).join('')
      + '<tr><td><b>합계</b></td><td class="n"><b>' + cl.today + '</b></td><td class="n"><b>' + cl.total3 + '</b></td><td class="n"><b>' + cl.total21 + '</b></td><td></td></tr></table>';
  } else right += '<div class="warn">미측정</div>';
  host.innerHTML = '<div>' + left + '</div><div>' + right + '</div>';
}

function lanes(s){
  const bm=s.usage.byModel||{};
  const fam=(k)=>/opus/.test(k)?'opus':/fable/.test(k)?'fable':/sonnet/.test(k)?'sonnet':/haiku/.test(k)?'haiku':'other';
  const agg={}; for(const [k,v] of Object.entries(bm)){ const f=fam(k); if(f==='other')continue; agg[f]=agg[f]||{tok:0,msgs:0,models:[]}; agg[f].tok+=v.output+v.cacheCreate; agg[f].msgs+=v.msgs; agg[f].models.push(MN(k)); }
  const order=['opus','fable','sonnet','haiku']; const max=Math.max(1,...order.map(f=>(agg[f]||{tok:0}).tok));
  const rows=order.map((f,i)=>{ const a=agg[f]||{tok:0,msgs:0,models:[]}; const y=18+i*44, bw=Math.max(2,(a.tok/max)*296);
    return `<g><text x="10" y="${y+14}" font-size="12.5" font-weight="700" fill="var(--tx)">${f}</text>`
      +`<circle cx="${'92'}" cy="${y+10}" r="4" fill="var(--${f})"/>`
      +`<text x="104" y="${y+14}" font-size="10.5" fill="var(--dim)">${svgesc((AGENTS[f]||[]).join(' · '))}</text>`
      +`<rect x="348" y="${y+2}" width="296" height="9" rx="4.5" fill="var(--line2)"/>`
      +`<rect x="348" y="${y+2}" width="${bw}" height="9" rx="4.5" fill="var(--${f})"/>`
      +`<text x="754" y="${y+11}" font-size="11" font-weight="600" fill="var(--tx)" text-anchor="end">${a.tok?kf(a.tok):'–'}</text>`
      +`<text x="104" y="${y+28}" font-size="10" fill="var(--dim)">${a.msgs?nf(a.msgs)+'메시지 · '+a.models.join(', '):'정책상 대기 — 이번 세션 사용 0'}</text></g>`;});
  $('#lanes').innerHTML = rows.join('');
  $('#lane-note').innerHTML = '<span>출력+캐시생성 토큰 · 전사 실측</span>';
}
function chanmap(s){
  const list=(s.marketing.channels.list||[]).slice().sort((a,b)=>(a.tier||'z').localeCompare(b.tier||'z')||a.id.localeCompare(b.id));
  const today=s.marketing.todayBy||{};
  $('#cmap').innerHTML = list.map(c=>{
    const n=today[c.id]||0; const cls=n?'pub':(!c.enabled?'off':(c.gate?'gate':''));
    return `<a class="${cls}" data-tab="pubs" title="${esc(c.id)} · ${c.tier||'-'}급 ${c.enabled?'':'(비활성)'}${c.gate?' · 게이트':''}${n?' · 오늘 '+n+'건':''}">${n?'<b>'+n+'</b> ':''}${esc(c.id)}</a>`;}).join('');
  [...$('#cmap').querySelectorAll('a')].forEach(a=>a.onclick=(e)=>{e.preventDefault();selectTab('pubs');});
}
function slotDetail(s){
  const sl=s.slot; $('#slot-at').textContent = sl? new Date(sl.at).toLocaleTimeString('ko-KR',{hour12:false}) : '미판독';
  if(!sl){ $('#slotd').innerHTML='<div class="empty">배정 미판독</div>'; return; }
  const rows=(t,arr)=>arr.length?`<table><tr><th style="width:170px">${t}</th><th>메모</th></tr>${arr.map(r=>`<tr><td class="mono">${esc(r.id)}</td><td style="color:var(--mut)">${esc(r.note)}</td></tr>`).join('')}</table>`:'';
  $('#slotd').innerHTML = rows('실행',sl.run) + rows('뚫기',sl.unblock)
    + (sl.ceoActivate.length?`<div class="kv"><span style="color:var(--mut)">대표 체크 · 즉시 가동</span><b>${sl.ceoActivate.map(esc).join(' · ')}</b></div>`:'')
    + (sl.ceoWaiting?`<div class="kv"><span style="color:var(--mut)">대표 가입/승인 대기 ${sl.ceoWaiting}건</span><b style="font-weight:500;text-align:right">${sl.ceoWaitingList.map(esc).join(' · ')}</b></div>`:'')
    + (sl.norule?`<div class="warnbox" style="margin:10px 0 0">규칙 미정의: ${esc(sl.norule)} — 이번 사이클에 행동을 정할 것</div>`:'');
}
/* ── 탭 ─────────────────────────────────────────────── */
const TABS=[['tickets','대표 대기',(s)=>s.marketing.ceoTickets],['pubs','오늘 발행',(s)=>s.marketing.todayCount],['events','이벤트',(s)=>(s.events||[]).length],
 ['slot','배정',(s)=>(s.slot&&s.slot.run?s.slot.run.length:0)],['models','모델',(s)=>Object.keys(s.usage.byModel||{}).length],['tools','도구',(s)=>Object.keys(s.usage.tools||{}).length],
 ['metrics','지표',()=>null],['cycles','사이클',(s)=>s.marketing.cycles.length],['git','커밋',(s)=>s.git.dirty],['control','제어',()=>null]];
let curTab='tickets';
function selectTab(t){ curTab=t;
  [...document.querySelectorAll('#panes > section')].forEach(x=>x.classList.toggle('show', x.dataset.tab===t));
  [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('sel', b.dataset.tab===t));
}
function tabs(s){
  const host=$('#tabs');
  // 탭 버튼은 «한 번만» 만든다 — 10초 갱신마다 다시 만들면 클릭·포커스가 초기화된다(실측 결함)
  if(!host.dataset.built){
    host.innerHTML = TABS.map(([id,label])=>`<button data-tab="${id}" class="${id===curTab?'sel':''}">${label}<span class="n" data-n="${id}"></span></button>`).join('');
    [...host.querySelectorAll('button')].forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
    host.dataset.built='1'; selectTab(curTab);
  }
  for(const [id,,cnt] of TABS){ const el=host.querySelector(`[data-n="${id}"]`); if(!el) continue; const n=cnt(s); el.textContent = n==null?'':nf(n); }
}

function paint(s){
  S=s; tiles(s); events(s.events||[]); models(s); tools(s); tickets(s); pubs(s); metrics(s); cycles(s); git(s);
  pipeline(s); perf(s); lanes(s); chanmap(s); slotDetail(s); tabs(s);
  $('#t-msgs').textContent=nf(s.usage.msgs); $('#t-scan').textContent=s.usage.scanning?'스캔 중…':(s.usage.file?'동기':'없음');
  $('#t-now').textContent=hm(s.now);
  $('#b-pause').className=s.state.paused?'on':''; $('#b-pause').textContent=s.state.paused?'▶ 재개':'⏸ 일시정지';
  $('#b-pub').className='pub'+(s.state.noPublish?' on':''); $('#b-pub').textContent=s.state.noPublish?'✅ 발행 허용':'⛔ 발행 금지';
  if(document.activeElement!==$('#note')) $('#note').value=s.state.note||'';
  $('#note-st').textContent=s.state.note?('지시 있음 · '+(s.state.updatedAt?hm(s.state.updatedAt):'')):'지시 없음';
}
async function refresh(){
  const keep=[...document.querySelectorAll('.scroll')].map(e=>[e,e.scrollTop]);
  const noteFocused = document.activeElement===$('#note');
  try{ const r=await fetch('/api/snapshot',{cache:'no-store'}); const j=await r.json(); paint(j);
       $('#d-live').className='dot live'; $('#t-live').textContent='연결됨';
  }catch(e){ $('#d-live').className='dot off'; $('#t-live').textContent='서버 끊김'; }
  for(const [e,t] of keep){ if(document.contains(e)) e.scrollTop=t; }
  if(noteFocused) $('#note').focus();
}
async function control(patch){ try{ await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)}); await refresh(); }catch(e){} }
$('#b-pause').onclick=()=>control({paused:!(S&&S.state.paused)});
$('#b-pub').onclick=()=>control({noPublish:!(S&&S.state.noPublish)});
$('#b-reload').onclick=refresh;
$('#b-note').onclick=()=>control({note:$('#note').value});
let es; function connect(){ try{ es=new EventSource('/api/stream');
  es.addEventListener('hook',(m)=>{ try{ const e=JSON.parse(m.data); const cur=(S&&S.events)||[]; const list=[e,...cur].slice(0,120); if(S)S.events=list; events(list); $('#t-now').textContent=hm(Date.now()); }catch{} });
  es.onopen=()=>{ $('#d-live').className='dot live'; $('#t-live').textContent='실시간'; };
  es.onerror=()=>{ $('#d-live').className='dot off'; $('#t-live').textContent='재연결…'; };
}catch(e){} }
refresh(); connect(); setInterval(refresh,10000);
</script></body></html>
