<!DOCTYPE html>
<html>

<head>
    <title>SIGNUM HQ Logo Test</title>
    <style>
        body {
            margin: 0;
            background: #0a0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 40px;
            flex-wrap: wrap;
            padding: 40px;
            font-family: -apple-system, sans-serif;
        }

        .row {
            display: flex;
            gap: 40px;
            align-items: flex-end;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .logo-container {
            text-align: center;
        }

        .logo-container h3 {
            color: #666;
            font-size: 12px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-container img {
            display: block;
        }

        .on-dark img {
            border: 1px solid #333;
        }

        .on-light {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
        }

        .on-light h3 {
            color: #999;
        }

        hr {
            width: 100%;
            border: none;
            border-top: 1px solid #222;
            margin: 20px 0;
        }

        h2 {
            color: #4af;
            width: 100%;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <h2>🔹 Transparent BG (Dark Surface Use)</h2>
    <div class="row">
        <div class="logo-container on-dark">
            <h3>400px</h3>
            <img src="/signum-sg-vectorized.svg" width="400" height="400" />
        </div>
        <div class="logo-container on-dark">
            <h3>128px</h3>
            <img src="/signum-sg-vectorized.svg" width="128" height="128" />
        </div>
        <div class="logo-container on-dark">
            <h3>64px</h3>
            <img src="/signum-sg-vectorized.svg" width="64" height="64" />
        </div>
        <div class="logo-container on-dark">
            <h3>32px</h3>
            <img src="/signum-sg-vectorized.svg" width="32" height="32" />
        </div>
    </div>

    <hr />

    <h2>🔸 With Dark BG (Icon / Favicon Use)</h2>
    <div class="row">
        <div class="logo-container on-dark">
            <h3>400px</h3>
            <img src="/signum-sg-icon-dark.svg" width="400" height="400" />
        </div>
        <div class="logo-container on-dark">
            <h3>128px</h3>
            <img src="/signum-sg-icon-dark.svg" width="128" height="128" />
        </div>
        <div class="logo-container on-dark">
            <h3>64px</h3>
            <img src="/signum-sg-icon-dark.svg" width="64" height="64" />
        </div>
        <div class="logo-container on-dark">
            <h3>32px</h3>
            <img src="/signum-sg-icon-dark.svg" width="32" height="32" />
        </div>
    </div>

    <hr />

    <h2>🔹 Transparent on Light BG Test</h2>
    <div class="row">
        <div class="logo-container on-light">
            <h3>128px on Light</h3>
            <img src="/signum-sg-vectorized.svg" width="128" height="128" />
        </div>
        <div class="logo-container on-light">
            <h3>Icon on Light</h3>
            <img src="/signum-sg-icon-dark.svg" width="128" height="128" />
        </div>
    </div>
</body>

</html>
