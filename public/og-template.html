<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNUM HQ — Default OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050a14;
      --cyan: #06b6d4;
      --cyan2: #22d3ee;
      --purple: #8b5cf6;
      --white: #ffffff;
      --muted: #94a3b8;
      --grid: rgba(99, 102, 241, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: Inter, Helvetica, Arial, sans-serif;
      background: #02040a;
    }
    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle 300px at 92% 8%, rgba(6,182,212,0.16), transparent 70%),
        radial-gradient(circle 220px at 0% 92%, rgba(139,92,246,0.12), transparent 72%),
        linear-gradient(135deg, #050a14 0%, #07101d 100%);
      isolation: isolate;
    }
    .og::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -8;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .og::after {
      content: "";
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 44px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(6,182,212,0.9), rgba(255,255,255,0.26), transparent);
      box-shadow: 0 0 16px rgba(6,182,212,0.45);
      pointer-events: none;
      z-index: 30;
    }
    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 40;
      opacity: 0.035;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.9) 0, rgba(255,255,255,0.9) 1px, transparent 1px, transparent 5px);
      mix-blend-mode: overlay;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 0%, transparent 52%, rgba(0,0,0,0.26) 100%),
        linear-gradient(90deg, rgba(5,10,20,0.06), transparent 28%, transparent 72%, rgba(5,10,20,0.06));
    }
    .chart-layer {
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: 0.52;
    }
    .chart-layer svg { width: 100%; height: 100%; overflow: visible; }
    .flow-layer {
      position: absolute;
      left: -40px;
      right: -40px;
      bottom: 90px;
      height: 250px;
      z-index: -2;
      opacity: 0.46;
    }
    .flow-layer svg { width: 100%; height: 100%; overflow: visible; }
    .center-lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 148px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mark {
      width: 100px;
      height: 100px;
      filter:
        drop-shadow(0 0 12px rgba(6,182,212,0.40))
        drop-shadow(0 0 28px rgba(6,182,212,0.18));
    }
    .wordmark {
      margin-top: 30px;
      color: var(--white);
      font-size: 62px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 8px 30px rgba(0,0,0,0.42), 0 0 18px rgba(255,255,255,0.16);
    }
    .tagline {
      margin-top: 18px;
      color: var(--cyan2);
      font-size: 21px;
      line-height: 1;
      font-weight: 300;
      letter-spacing: 0.24em;
      text-shadow: 0 0 18px rgba(6,182,212,0.25);
    }
    .chart-glow-right {
      position: absolute;
      right: -160px;
      top: -170px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: rgba(6,182,212,0.09);
      filter: blur(36px);
      z-index: -6;
    }
    .chart-glow-left {
      position: absolute;
      left: -150px;
      bottom: -130px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(139,92,246,0.08);
      filter: blur(34px);
      z-index: -6;
    }
  </style>
</head>
