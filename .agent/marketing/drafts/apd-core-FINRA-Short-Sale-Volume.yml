description: >-
  Daily short sale volume ratio (short volume divided by total volume of trades
  reported to FINRA off-exchange facilities) for 49 widely traded US stocks and
  ETFs over the latest 20 trading days, 980 rows in one CSV: date, symbol, short
  volume, short-exempt volume, total volume and short ratio in percent. Compiled
  from the public FINRA Reg SHO daily short sale volume files (consolidated
  file) and refreshed weekly. This is short sale volume, not short interest
  (open short positions); the README explains the limits and ranks each
  ticker's latest day against its own 20-day average. Downloads directly with
  no login and no API key.
